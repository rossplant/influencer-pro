<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set the Plantr Collab admin password</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f6f4; color: #17211c; }
    main { max-width: 420px; margin: 48px auto; background: white; padding: 24px; border-radius: 12px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    button { margin-top: 16px; background: #1f6b4a; color: white; border: 0; border-radius: 8px; padding: 10px 14px; font: inherit; }
    .error { color: #8d2b2b; }
    p { color: #3d5148; }
  </style>
</head>
<body>
  <main>
    <h1>Set the admin password</h1>
    <p>This page works once. The password stays in this browser request and is stored only as a hash.</p>
    <form id="setup" method="post" action="/admin/setup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="" readonly>
      <label for="token">Setup token</label>
      <input id="token" name="token" type="password" autocomplete="off" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="password_confirm">Confirm password</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Save password</button>
      <p id="error" class="error"></p>
    </form>
  </main>
  <script>
    document.getElementById("setup").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const response = await fetch("/admin/setup", {
        method: "POST",
        credentials: "include",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          token: form.get("token"),
          password: form.get("password"),
          password_confirm: form.get("password_confirm")
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        document.getElementById("error").textContent = data.detail || "Setup failed";
        return;
      }
      window.location.href = "/admin";
    });
  </script>
</body>
</html>
