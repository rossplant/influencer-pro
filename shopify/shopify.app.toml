# Plantr Collab Shopify app (public distribution, limited visibility / unlisted).
# Not deployed. Fill client_id from the Dev Dashboard after Ross approves the Partner
# account and app submission. Deploy with `shopify app deploy` from this folder.
# The client secret is never stored here; it lives in Railway as SHOPIFY_API_SECRET.

client_id = "REPLACE_WITH_CLIENT_ID"
name = "Plantr Collab"
application_url = "https://plantr-collab.com/seller/profile"
embedded = false

[access_scopes]
# read_orders covers the last 60 days. No protected customer fields (name, email,
# address, phone) are requested: Level 1 protected customer data only.
scopes = "read_orders"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://plantr-collab.com/shopify/oauth/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "refunds/create", "app/uninstalled"]
uri = "https://plantr-collab.com/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://plantr-collab.com/shopify/webhooks"
